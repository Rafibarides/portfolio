<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rafi Barides - Portfolio</title>
    <script type="text/javascript">
      // Store the current path in sessionStorage and redirect to index
      var redirect = sessionStorage.getItem('redirect');
      if (!redirect) {
        sessionStorage.setItem('redirect', location.pathname + location.search + location.hash);
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
